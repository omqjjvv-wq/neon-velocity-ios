name: Build NEON VELOCITY iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      # package.json already pins pnpm via its packageManager field.
      # Do not add a second version here.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web game
        run: pnpm build:client

      - name: Sync Capacitor iOS project
        run: pnpm exec cap sync ios

      - name: Build unsigned iOS archive
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build

          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/App.app
          cd build
          /usr/bin/zip -qr NEON-VELOCITY-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEON-VELOCITY-iOS-unsigned
          path: build/NEON-VELOCITY-unsigned.ipa
          retention-days: 30
